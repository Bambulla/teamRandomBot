<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Аватарка ра [бот] аем</title>
  <desc id="desc">Градиентная аватарка для VK Teams-бота с фразой ра [бот] аем.</desc>
  <defs>
    <linearGradient id="bg" x1="126" y1="80" x2="898" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A7A"/>
      <stop offset="0.38" stop-color="#AD5CFF"/>
      <stop offset="0.72" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="24%" r="65%">
