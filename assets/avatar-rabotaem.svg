    <text x="512" y="474" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#FFFFFF">ра</text>
    <text x="512" y="584" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#FFFFFF">[бот]</text>
    <text x="512" y="694" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#FFFFFF">аем</text>
